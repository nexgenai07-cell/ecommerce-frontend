<!doctype html>
<!-- Document type declaration: tells the browser this is an HTML5 document -->
<html lang="en">
  <!-- Root HTML element with language set to English for accessibility and SEO -->
  <head>
    <!-- Head section contains metadata and resource links, nothing visible here -->

    <meta charset="UTF-8" />
    <!-- Character encoding set to UTF-8: supports all international characters including Urdu, Arabic, etc. -->

    <link rel="icon" type="image/svg+xml" href="/icons.svg" />
    <!-- Favicon link: the small icon shown in browser tab, loaded from /icons.svg as an SVG file -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Viewport meta tag: makes the page responsive on mobile devices by matching screen width and setting zoom to 1x -->

    <title>Zyron</title>
    <!-- Page title: shown in the browser tab and used by search engines -->

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google Identity Services (GIS) library: provides window.google.accounts.id, -->
    <!-- which is used on the Login and Register pages to render the official Google -->
    <!-- Sign-In button and to handle the OAuth ID token exchange. Loaded with -->
    <!-- async/defer so it never blocks the initial page render; the Google Sign-In -->
    <!-- hook (src/hooks/useGoogleSignIn.js) safely waits for this script to finish -->
    <!-- loading before it tries to use it. -->
  </head>
  <body>
    <!-- Body section: contains everything visible on the page -->

    <div id="root"></div>
    <!-- Empty div with id="root": this is where React mounts and renders the entire app -->

    <script type="module" src="/src/main.jsx"></script>
    <!-- Module script tag: loads the React app entry point (main.jsx); type="module" enables ES module imports (import/export syntax) -->
  </body>
</html>
